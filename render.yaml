# Render Blueprint: New > Blueprint > connect your GitHub repo.
services:
  - type: web
    name: protishruti
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: OPENAI_API_KEY
        sync: false
      - key: ASR_ENABLED
        value: "true"
      - key: ASR_BACKEND
        value: groq
      - key: ALLOW_REAL_DATA
        value: "false"
      - key: DOCS_ADMIN_PASSWORD
        sync: false
      - key: DOCS_SUPERADMIN_PASSWORD
        sync: false
      - key: DOCS_SECRET
        generateValue: true
      - key: DOCS_OPEN_FROM
        value: "2026-11-20T00:00"
      - key: DOCS_OPEN_UNTIL
        value: "2026-12-31T23:59"
      - key: DOCS_GITHUB_REPO
        sync: false
      - key: DOCS_GITHUB_TOKEN
        sync: false
