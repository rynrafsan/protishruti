# Render Blueprint: New > Blueprint > connect your GitHub repo.
services:
  - type: web
    name: protishruti
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: OPENAI_API_KEY
        sync: false
      - key: ASR_ENABLED
        value: "true"
      - key: ASR_BACKEND
        value: groq
      - key: ALLOW_REAL_DATA
        value: "false"
