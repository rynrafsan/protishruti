<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Protishruti docs — not available</title>
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Tiro+Bangla&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #EAF0EC; color: #1F2D28; font: 17px/1.6 'Hind Siliguri', system-ui, sans-serif; padding: 20px; }
  .card { max-width: 520px; background: #F8FAF7; border: 1px solid #CAD6CF; border-radius: 16px; padding: 34px 32px; }
  img { width: 52px; height: 52px; border-radius: 12px; }
  h1 { font: 400 30px/1.25 'Tiro Bangla', Georgia, serif; color: #0E4B3B; margin: 18px 0 8px; }
  p { margin: 0 0 12px; }
  .when { font-weight: 600; }
  .small { font-size: 15px; color: #586A63; margin-top: 22px; }
  a { color: #1B6B53; }
</style>
</head>
<body>
<main class="card">
  <img src="/brand/icon.svg" alt="Protishruti">
  <h1>The documentation is not available right now</h1>
  <p>{{message}}</p>
  <p class="when">{{when}}</p>
  <p><a href="/">Open the Protishruti app</a></p>
  <p class="small">Team member? <a href="/docs/admin">Sign in</a> to view or change this.</p>
</main>
</body>
</html>
